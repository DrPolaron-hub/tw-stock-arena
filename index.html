<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (v, d=1) => (v == null || isNaN(v)) ? '—' : Number(v).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
  const pct = (v, d=2) => (v == null || isNaN(v)) ? '—' : `${v > 0 ? '+' : ''}${Number(v).toFixed(d)}%`;
  const pts = (v, d=1) => (v == null || isNaN(v)) ? '—' : `${v > 0 ? '+' : ''}${fmt(v, d)} 點`;
  const cls = v => (v == null || isNaN(v)) ? '' : (v > 0 ? 'up' : (v < 0 ? 'down' : ''));

  let DATA = JSON.parse($('arenaData').textContent);
  // Load locally imported overrides from localStorage if any
  try {
    const saved = localStorage.getItem('tw_stock_arena_overrides');
    if (saved) {
      const ov = JSON.parse(saved);
      DATA.models = DATA.models.map(m => ov[m.id] ? Object.assign({}, m, ov[m.id], {status:'active'}) : m);
    }
  } catch(e){}

  let curTab = 'overview'; // 'overview', 'diagnosis', or model id
  let diagQuery = '';
  let diagHorizon = 'all';
  let modelStockQuery = '';
  let modelStockPick = '';
  let modelHorizon = 'all';

  $('btnTheme').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  };
  $('btnFont').onclick = () => document.documentElement.classList.toggle('font-lg');
  $('btnOpenImport').onclick = () => $('importModal').classList.add('open');
  $('btnCloseImport').onclick = () => $('importModal').classList.remove('open');
  $('btnApplyImport').onclick = () => {
    try {
      const obj = JSON.parse($('importTextarea').value.trim());
      if (!obj.id) throw new Error('JSON 缺少 "id" 欄位（例如 "gpt", "grok"）');
      const idx = DATA.models.findIndex(m => m.id === obj.id.toLowerCase());
      if (idx === -1) throw new Error('未知的模型 ID: ' + obj.id);
      DATA.models[idx] = Object.assign({}, DATA.models[idx], obj, {status:'active'});
      const ov = JSON.parse(localStorage.getItem('tw_stock_arena_overrides') || '{}');
      ov[DATA.models[idx].id] = obj;
      localStorage.setItem('tw_stock_arena_overrides', JSON.stringify(ov));
      $('importModal').classList.remove('open');
      $('importTextarea').value = '';
      renderNav();
      renderMain();
      alert('成功匯入 ' + DATA.models[idx].name + ' 資料！');
    } catch (err) {
      alert('JSON 解析失敗：' + err.message);
    }
  };

  function calcStats(vals) {
    const valid = vals.filter(v => v != null && !isNaN(v));
    if (!valid.length) return {avg: null, win: null, cnt: 0};
    return {
      avg: valid.reduce((a,b) => a+b, 0) / valid.length,
      win: valid.filter(v => v > 0).length / valid.length * 100,
      cnt: valid.length
    };
  }

  function calcModelScore(m) {
    if (m.status !== 'active') return -1;
    const sh = m.stockHistory || [];
    const sDay = calcStats(sh.map(r => r.retDay));
    const sNext = calcStats(sh.map(r => r.retNext));
    const s5 = calcStats(sh.map(r => r.ret5));
    const s20 = calcStats(sh.map(r => r.ret20));
    const mktHit = m.mktStats?.hitRateDay ?? 50;
    const stockWin = s5.win ?? sNext.win ?? sDay.win ?? 50;
    const avgRet = s5.avg ?? sNext.avg ?? sDay.avg ?? 0;
    return Math.round((mktHit * 0.4 + stockWin * 0.4 + Math.max(-10, Math.min(10, avgRet)) * 2 + 10) * 10) / 10;
  }

  function renderNav() {
    const tabs = [
      {id: 'overview', label: '🏆 7大模型總覽 ＆ 排行榜', active: true},
      {id: 'diagnosis', label: '🔍 個股短中長期診斷（當沖／隔日沖／週／月）', active: true},
      ...DATA.models.map(m => ({id: m.id, label: `${m.icon} ${m.name}`, status: m.status}))
    ];
    $('navBar').innerHTML = tabs.map(t => `
      <button class="tab-btn ${curTab === t.id ? 'active' : ''}" data-id="${t.id}">
        ${t.status ? `<span class="dot ${t.status === 'active' ? 'dot-on' : 'dot-off'}"></span>` : ''}
        ${esc(t.label)}
      </button>
    `).join('');
    $('navBar').querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => { curTab = btn.dataset.id; modelStockQuery = ''; modelStockPick = ''; modelHorizon = 'all'; renderNav(); renderMain(); };
    });
  }

  function renderOverview() {
    const activeModels = DATA.models.filter(m => m.status === 'active');
    const ranked = [...DATA.models].sort((a, b) => calcModelScore(b) - calcModelScore(a));

    // Consensus picks across active models
    const pickMap = new Map();
    activeModels.forEach(m => {
      (m.top3Today || []).forEach(p => {
        if (!pickMap.has(p.code)) pickMap.set(p.code, {code: p.code, name: p.name, models: [], tags: []});
        pickMap.get(p.code).models.push(m.icon + ' ' + m.name);
        if (p.horizonTag) pickMap.get(p.code).tags.push(p.horizonTag);
      });
    });
    const consensus = [...pickMap.values()].sort((a,b) => b.models.length - a.models.length);

    return `
      <div class="kpi-grid">
        <div class="kpi-box">
          <div class="kpi-lbl">已上線參與競技模型</div>
          <div class="kpi-val">${activeModels.length} / 7 位</div>
          <div class="kpi-sub">待匯入模型可點右上角「匯入 JSON」立即上榜</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-lbl">目前綜合排名第 1 名</div>
          <div class="kpi-val">${ranked[0].status === 'active' ? ranked[0].icon + ' ' + ranked[0].name : '尚無數據'}</div>
          <div class="kpi-sub">綜合評分 ${calcModelScore(ranked[0]) > 0 ? calcModelScore(ranked[0]) + ' 分' : '—'}</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-lbl">大盤最新收盤基準</div>
          <div class="kpi-val">${fmt(DATA.marketClose, 2)} 點</div>
          <div class="kpi-sub ${cls(DATA.marketChg)}">漲跌 ${pts(DATA.marketChg, 2)}</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-lbl">多模型共振精選標的數</div>
          <div class="kpi-val">${consensus.length} 檔</div>
          <div class="kpi-sub">跨模型重複推薦自動標註共識度</div>
        </div>
      </div>

      <div class="card">
        <h2>一、7 大模型實戰綜合排行榜（大盤準度 × 個股四週期報酬）</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>排名</th>
                <th>AI 模型</th>
                <th>狀態</th>
                <th class="num">綜合評分</th>
                <th class="num">大盤當日/隔日勝率</th>
                <th class="num">大盤 MAE 誤差</th>
                <th class="num">個股當沖均報</th>
                <th class="num">個股隔日沖均報</th>
                <th class="num">個股 5日均報</th>
                <th class="num">個股 20日均報</th>
              </tr>
            </thead>
            <tbody>
              ${ranked.map((m, i) => {
                const sc = calcModelScore(m);
                const sh = m.stockHistory || [];
                const sD = calcStats(sh.map(r => r.retDay));
                const sN = calcStats(sh.map(r => r.retNext));
                const s5 = calcStats(sh.map(r => r.ret5));
                const s20 = calcStats(sh.map(r => r.ret20));
                return `
                  <tr>
                    <td><b>${sc >= 0 ? '#' + (i+1) : '—'}</b></td>
                    <td><b>${m.icon} ${esc(m.name)}</b></td>
                    <td><span class="badge ${m.status === 'active' ? 'b-info' : ''}">${m.status === 'active' ? '已上線' : '待匯入'}</span></td>
                    <td class="num"><b>${sc >= 0 ? fmt(sc, 1) + ' 分' : '—'}</b></td>
                    <td class="num">${m.mktStats ? fmt(m.mktStats.hitRateDay, 1) + '%' : '—'}</td>
                    <td class="num">${m.mktStats ? fmt(m.mktStats.maeDay, 1) + ' 點' : '—'}</td>
                    <td class="num ${cls(sD.avg)}"><b>${pct(sD.avg)}</b></td>
                    <td class="num ${cls(sN.avg)}"><b>${pct(sN.avg)}</b></td>
                    <td class="num ${cls(s5.avg)}"><b>${pct(s5.avg)}</b></td>
                    <td class="num ${cls(s20.avg)}"><b>${pct(s20.avg)}</b></td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>二、7 大模型大盤四週期最新預測對照（當日／隔日／週 5日／月 20日）</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>AI 模型</th>
                <th>目標基準日</th>
                <th class="num">當日預測</th>
                <th class="num">隔日預測</th>
                <th class="num">週預測 (5日)</th>
                <th class="num">月預測 (20日)</th>
                <th>核心盤勢判讀</th>
              </tr>
            </thead>
            <tbody>
              ${DATA.models.map(m => {
                const f = m.mktForecast;
                return `
                  <tr>
                    <td><b>${m.icon} ${esc(m.name)}</b></td>
                    <td>${f ? esc(f.targetDate) : '—'}</td>
                    <td class="num ${f ? cls(f.dayPts) : ''}"><b>${f ? pts(f.dayPts, 0) : '—'}</b></td>
                    <td class="num ${f ? cls(f.nextPts) : ''}"><b>${f ? pts(f.nextPts, 0) : '—'}</b></td>
                    <td class="num ${f ? cls(f.weekPts) : ''}"><b>${f ? pts(f.weekPts, 0) : '—'}</b></td>
                    <td class="num ${f ? cls(f.monthPts) : ''}"><b>${f ? pts(f.monthPts, 0) : '—'}</b></td>
                    <td style="white-space:normal;min-width:260px;font-size:0.82rem;color:var(--muted)">${f ? esc(f.note) : '尚未匯入預測 JSON'}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>三、最新個股推薦共振池（Top 3 Picks Consensus）</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>代號與名稱</th>
                <th>共識推薦模型</th>
                <th>推薦數</th>
                <th>短中長期診斷屬性</th>
              </tr>
            </thead>
            <tbody>
              ${consensus.length ? consensus.map(c => `
                <tr>
                  <td><b>${esc(c.code)} ${esc(c.name)}</b></td>
                  <td>${c.models.map(x => `<span class="badge b-info" style="margin-right:4px">${esc(x)}</span>`).join('')}</td>
                  <td><b>${c.models.length} / ${activeModels.length}</b></td>
                  <td><span class="badge b-gold">${esc(c.tags[0] || '—')}</span></td>
                </tr>
              `).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--muted)">尚無推薦資料</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function renderDiagnosis() {
    // Collect all stock history across all active models
    const allRows = [];
    DATA.models.filter(m => m.status === 'active').forEach(m => {
      (m.stockHistory || []).forEach(r => {
        allRows.push(Object.assign({}, r, {modelName: m.name, modelIcon: m.icon}));
      });
    });
    allRows.sort((a, b) => b.date.localeCompare(a.date));

    const q = diagQuery.toLowerCase();
    const filtered = allRows.filter(r => {
      if (q && !(r.code + ' ' + r.name + ' ' + r.modelName).toLowerCase().includes(q)) return false;
      if (diagHorizon === 'short' && !((r.retDay != null && r.retDay >= 1.5) || (r.retNext != null && r.retNext >= 1.5))) return false;
      if (diagHorizon === 'mid' && !(r.ret5 != null && r.ret5 >= 2.0)) return false;
      if (diagHorizon === 'long' && !(r.ret20 != null && r.ret20 >= 2.0)) return false;
      return true;
    });

    const sD = calcStats(filtered.map(r => r.retDay));
    const sN = calcStats(filtered.map(r => r.retNext));
    const s5 = calcStats(filtered.map(r => r.ret5));
    const s20 = calcStats(filtered.map(r => r.ret20));

    return `
      <div class="card">
        <h2>🔍 個股短／中／長期投資週期診斷中心（跨模型實證追蹤）</h2>
        <p style="font-size:0.86rem;color:var(--muted);margin-top:0">
          彙整各模型選出的個股於 <b>當沖（T日）</b>、<b>隔日沖（T+1）</b>、<b>中期（週／5日）</b> 與 <b>長期（月／20日）</b> 四個時段的真實報酬表現，協助判斷該股最適合的操作週期。
        </p>
        <div class="filter-bar">
          <label style="font-size:0.84rem;font-weight:600">個股／模型搜尋：</label>
          <input type="text" id="diagInput" value="${esc(diagQuery)}" placeholder="輸入代號、股名或模型（如 2603、長榮、聚陽）" style="min-width:240px">
          <select id="diagSel">
            <option value="all" ${diagHorizon==='all'?'selected':''}>顯示全部週期</option>
            <option value="short" ${diagHorizon==='short'?'selected':''}>⚡ 僅看短期強勢（當沖／隔日沖 >= 1.5%）</option>
            <option value="mid" ${diagHorizon==='mid'?'selected':''}>📈 僅看中期強勢（5日 >= 2.0%）</option>
            <option value="long" ${diagHorizon==='long'?'selected':''}>🏦 僅看長期強勢（20日 >= 2.0%）</option>
          </select>
          <button class="btn" id="diagClear">清除篩選</button>
        </div>
        <div class="kpi-grid">
          <div class="kpi-box"><div class="kpi-lbl">⚡ 當沖平均 (T日)</div><div class="kpi-val ${cls(sD.avg)}">${pct(sD.avg)}</div><div class="kpi-sub">勝率 ${sD.win!=null?fmt(sD.win,1)+'%':'—'} (${sD.cnt}筆)</div></div>
          <div class="kpi-box"><div class="kpi-lbl">🚀 隔日沖平均 (T+1)</div><div class="kpi-val ${cls(sN.avg)}">${pct(sN.avg)}</div><div class="kpi-sub">勝率 ${sN.win!=null?fmt(sN.win,1)+'%':'—'} (${sN.cnt}筆)</div></div>
          <div class="kpi-box"><div class="kpi-lbl">📈 中期週平均 (5日)</div><div class="kpi-val ${cls(s5.avg)}">${pct(s5.avg)}</div><div class="kpi-sub">勝率 ${s5.win!=null?fmt(s5.win,1)+'%':'—'} (${s5.cnt}筆)</div></div>
          <div class="kpi-box"><div class="kpi-lbl">🏦 長期月平均 (20日)</div><div class="kpi-val ${cls(s20.avg)}">${pct(s20.avg)}</div><div class="kpi-sub">勝率 ${s20.win!=null?fmt(s20.win,1)+'%':'—'} (${s20.cnt}筆)</div></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>進榜日期</th>
                <th>推薦模型</th>
                <th>個股代號與名稱</th>
                <th class="num">當沖</th>
                <th class="num">隔日沖</th>
                <th class="num">週 (5日)</th>
                <th class="num">月 (20日)</th>
                <th>投資週期診斷判定</th>
              </tr>
            </thead>
            <tbody>
              ${filtered.length ? filtered.map(r => `
                <tr>
                  <td><b>${esc(r.date)}</b></td>
                  <td><span class="badge">${r.modelIcon} ${esc(r.modelName)}</span></td>
                  <td><b>${esc(r.code)} ${esc(r.name)}</b></td>
                  <td class="num ${cls(r.retDay)}"><b>${pct(r.retDay)}</b></td>
                  <td class="num ${cls(r.retNext)}"><b>${pct(r.retNext)}</b></td>
                  <td class="num ${cls(r.ret5)}"><b>${pct(r.ret5)}</b></td>
                  <td class="num ${cls(r.ret20)}"><b>${pct(r.ret20)}</b></td>
                  <td><span class="badge ${r.tag && (r.tag.includes('雙強')||r.tag.includes('中期')) ? 'b-bull' : (r.tag && r.tag.includes('拉回') ? 'b-bear' : 'b-gold')}">${esc(r.tag || '—')}</span></td>
                </tr>
              `).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:18px">查無符合條件之個股診斷資料</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function renderModelDetail(m) {
    if (m.status !== 'active') {
      return `
        <div class="card" style="text-align:center;padding:42px 20px">
          <div style="font-size:2.4rem;margin-bottom:8px">${m.icon}</div>
          <h2>${esc(m.name)} 模型 — 等待接入數據中</h2>
          <p style="color:var(--muted);max-width:520px;margin:8px auto 18px">
            請將「統一 JSON 規格書」提供給 ${esc(m.name)}，讓它產出當日大盤 4 週期預測與 Top 3 個股後，點擊上方「📥 貼上 / 匯入模型 JSON」即可立即點亮本頁並加入排行榜！
          </p>
          <button class="btn primary" onclick="document.getElementById('btnOpenImport').click()">立即匯入 ${esc(m.name)} JSON</button>
        </div>
      `;
    }
    const f = m.mktForecast || {};
    return `
      <div class="card">
        <h2>${m.icon} ${esc(m.name)} — 最新大盤四週期預測（目標日：${esc(f.targetDate)}）</h2>
        <div class="kpi-grid">
          <div class="kpi-box"><div class="kpi-lbl">當日預測</div><div class="kpi-val ${cls(f.dayPts)}">${pts(f.dayPts, 0)}</div></div>
          <div class="kpi-box"><div class="kpi-lbl">隔日預測</div><div class="kpi-val ${cls(f.nextPts)}">${pts(f.nextPts, 0)}</div></div>
          <div class="kpi-box"><div class="kpi-lbl">週預測 (5日)</div><div class="kpi-val ${cls(f.weekPts)}">${pts(f.weekPts, 0)}</div></div>
          <div class="kpi-box"><div class="kpi-lbl">月預測 (20日)</div><div class="kpi-val ${cls(f.monthPts)}">${pts(f.monthPts, 0)}</div></div>
        </div>
        <div style="padding:10px 14px;background:var(--panel-alt);border-radius:8px;font-size:0.86rem;color:var(--muted)">
          <b>盤勢核心診斷：</b>${esc(f.note)}
        </div>
      </div>

      <div class="card">
        <h2>${m.icon} ${esc(m.name)} — 今日精選 Top 3 個股 ＆ 短中長期操作建議</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>順位</th><th>代號與名稱</th><th>低接區間</th><th>目標價</th><th>停損價</th><th>週期屬性診斷</th><th>入選理由</th></tr>
            </thead>
            <tbody>
              ${(m.top3Today || []).map(p => `
                <tr>
                  <td><b>#${p.rank}</b></td>
                  <td><b>${esc(p.code)} ${esc(p.name)}</b></td>
                  <td>${esc(p.entry)}</td>
                  <td class="up"><b>${esc(p.target)}</b></td>
                  <td class="down">${esc(p.stop)}</td>
                  <td><span class="badge b-gold">${esc(p.horizonTag)}</span></td>
                  <td style="white-space:normal;min-width:220px;font-size:0.82rem;color:var(--muted)">${esc(p.reason)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>

      ${(() => {
        const sh = m.stockHistory || [];
        const stockCountMap = new Map();
        sh.forEach(r => {
          const k = r.code;
          if (!stockCountMap.has(k)) stockCountMap.set(k, {code: r.code, name: r.name, cnt: 0});
          stockCountMap.get(k).cnt += 1;
        });
        const stockOptions = [...stockCountMap.values()].sort((a, b) => b.cnt - a.cnt || a.code.localeCompare(b.code));
        const mq = modelStockQuery.trim().toLowerCase();
        const mFiltered = sh.filter(r => {
          if (modelStockPick && r.code !== modelStockPick) return false;
          if (mq && !(r.code + ' ' + r.name).toLowerCase().includes(mq)) return false;
          if (modelHorizon === 'short' && !((r.retDay != null && r.retDay >= 1.5) || (r.retNext != null && r.retNext >= 1.5))) return false;
          if (modelHorizon === 'mid' && !(r.ret5 != null && r.ret5 >= 2.0)) return false;
          if (modelHorizon === 'long' && !(r.ret20 != null && r.ret20 >= 2.0)) return false;
          return true;
        });
        const mD = calcStats(mFiltered.map(r => r.retDay));
        const mN = calcStats(mFiltered.map(r => r.retNext));
        const m5 = calcStats(mFiltered.map(r => r.ret5));
        const m20 = calcStats(mFiltered.map(r => r.ret20));
        return `
          <div class="card">
            <h2>歷史個股四時段實戰復盤（最新日期置頂）</h2>
            <div class="filter-bar">
              <label style="font-size:0.84rem;font-weight:600">個股篩選：</label>
              <input type="text" id="modelStockInput" value="${esc(modelStockQuery)}" placeholder="輸入代號或股名（如 1477、聚陽）" style="min-width:210px">
              <select id="modelStockSelect">
                <option value="">全部個股（共 ${sh.length} 筆）</option>
                ${stockOptions.map(o => `<option value="${esc(o.code)}" ${modelStockPick===o.code?'selected':''}>${esc(o.code)} ${esc(o.name !== o.code ? o.name : '')}（${o.cnt}次）</option>`).join('')}
              </select>
              <select id="modelHorizonSel">
                <option value="all" ${modelHorizon==='all'?'selected':''}>全部週期</option>
                <option value="short" ${modelHorizon==='short'?'selected':''}>⚡ 短期強勢（當沖／隔日沖 &gt;= 1.5%）</option>
                <option value="mid" ${modelHorizon==='mid'?'selected':''}>📈 中期強勢（5日 &gt;= 2.0%）</option>
                <option value="long" ${modelHorizon==='long'?'selected':''}>🏦 長期強勢（20日 &gt;= 2.0%）</option>
              </select>
              <button class="btn" id="modelFilterClear">清除篩選</button>
            </div>
            <div class="kpi-grid">
              <div class="kpi-box"><div class="kpi-lbl">⚡ 當沖平均 (T日)</div><div class="kpi-val ${cls(mD.avg)}">${pct(mD.avg)}</div><div class="kpi-sub">勝率 ${mD.win!=null?fmt(mD.win,1)+'%':'—'} (${mD.cnt}筆)</div></div>
              <div class="kpi-box"><div class="kpi-lbl">🚀 隔日沖平均 (T+1)</div><div class="kpi-val ${cls(mN.avg)}">${pct(mN.avg)}</div><div class="kpi-sub">勝率 ${mN.win!=null?fmt(mN.win,1)+'%':'—'} (${mN.cnt}筆)</div></div>
              <div class="kpi-box"><div class="kpi-lbl">📈 中期週平均 (5日)</div><div class="kpi-val ${cls(m5.avg)}">${pct(m5.avg)}</div><div class="kpi-sub">勝率 ${m5.win!=null?fmt(m5.win,1)+'%':'—'} (${m5.cnt}筆)</div></div>
              <div class="kpi-box"><div class="kpi-lbl">🏦 長期月平均 (20日)</div><div class="kpi-val ${cls(m20.avg)}">${pct(m20.avg)}</div><div class="kpi-sub">勝率 ${m20.win!=null?fmt(m20.win,1)+'%':'—'} (${m20.cnt}筆)</div></div>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>進榜日期</th><th>順位</th><th>個股</th><th class="num">當沖</th><th class="num">隔日沖</th><th class="num">週 (5日)</th><th class="num">月 (20日)</th><th>診斷</th></tr>
                </thead>
                <tbody>
                  ${mFiltered.length ? mFiltered.map(r => `
                    <tr>
                      <td><b>${esc(r.date)}</b></td>
                      <td>#${r.rank}</td>
                      <td><b>${esc(r.code)} ${esc(r.name)}</b></td>
                      <td class="num ${cls(r.retDay)}"><b>${pct(r.retDay)}</b></td>
                      <td class="num ${cls(r.retNext)}"><b>${pct(r.retNext)}</b></td>
                      <td class="num ${cls(r.ret5)}"><b>${pct(r.ret5)}</b></td>
                      <td class="num ${cls(r.ret20)}"><b>${pct(r.ret20)}</b></td>
                      <td><span class="badge">${esc(r.tag)}</span></td>
                    </tr>
                  `).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:18px">查無符合篩選條件之個股紀錄</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>
        `;
      })()}
    `;
  }

  function renderMain() {
    if (curTab === 'overview') {
      $('mainBox').innerHTML = renderOverview();
    } else if (curTab === 'diagnosis') {
      $('mainBox').innerHTML = renderDiagnosis();
      $('diagInput').oninput = e => { diagQuery = e.target.value; renderMain(); $('diagInput').focus(); };
      $('diagSel').onchange = e => { diagHorizon = e.target.value; renderMain(); };
      $('diagClear').onclick = () => { diagQuery = ''; diagHorizon = 'all'; renderMain(); };
    } else {
      const m = DATA.models.find(x => x.id === curTab);
      $('mainBox').innerHTML = renderModelDetail(m);
      const inp = $('modelStockInput');
      if (inp) {
        inp.oninput = e => {
          const pos = e.target.selectionStart;
          modelStockQuery = e.target.value;
          renderMain();
          const el = $('modelStockInput');
          if (el) { el.focus(); el.setSelectionRange(pos, pos); }
        };
      }
      const sel = $('modelStockSelect');
      if (sel) sel.onchange = e => { modelStockPick = e.target.value; renderMain(); };
      const hSel = $('modelHorizonSel');
      if (hSel) hSel.onchange = e => { modelHorizon = e.target.value; renderMain(); };
      const clr = $('modelFilterClear');
      if (clr) clr.onclick = () => { modelStockQuery = ''; modelStockPick = ''; modelHorizon = 'all'; renderMain(); };
    }
  }

  renderNav();
  renderMain();
})();
</script>
</body>
</html>
